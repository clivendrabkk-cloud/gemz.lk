<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Account Login — Gemz.lk</title>
<link rel="icon" type="image/svg+xml" href="assets/gemz-favicon.svg">
<link rel="preload" as="image" href="assets/gemz-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'"><noscript><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"></noscript>
<link rel="stylesheet" href="css/style.css"><script>document.documentElement.classList.add('js')</script>
</head><body>
<div id="site-header"></div>
<main><section style="background:var(--paper-2)"><div class="wrap">
  <div class="auth" data-reveal>
    <span class="eyebrow">Welcome back</span><h2 style="font-size:2.6rem;margin-bottom:26px">Account Login</h2>
    <form class="f" id="lf">
      <div class="field"><label for="loginEmail">Email</label><input id="loginEmail" name="email" type="email" autocomplete="username" required></div>
      <div class="field"><label for="loginPassword">Password</label><input id="loginPassword" name="password" type="password" autocomplete="current-password" required minlength="6"></div>
      <button class="btn btn-gold" type="submit" style="justify-content:center">Sign In</button>
      <p class="note" id="n" aria-live="polite"></p>
      <div id="accountState" hidden></div>
    </form>
    <p class="account-note">You can send an enquiry without an account. <a class="text-link" href="cart.html">Open your inquiry cart</a>.</p>
  </div>
</div></section></main>
<div id="site-footer"></div>
<script src="js/supabase-config.js"></script>
<script src="js/app.js"></script>
<script>
const loginForm=document.getElementById('lf');
const loginNote=document.getElementById('n');
const accountState=document.getElementById('accountState');
async function updateAccountState(){
  const client=await window.GEMZ_GET_SUPABASE();
  if(!client)return;
  const {data}=await client.auth.getSession();
  const email=data.session?.user?.email;
  accountState.hidden=!email;
  accountState.innerHTML=email?`<p>Signed in as <strong>${htmlEscape(email)}</strong>.</p><button class="btn btn-ghost" id="signOut" type="button">Sign Out</button>`:'';
  document.getElementById('signOut')?.addEventListener('click',async()=>{
    const {error}=await client.auth.signOut();
    loginNote.textContent=error?'We could not sign you out. Please try again.':'You have signed out.';
    updateAccountState();
  });
}
loginForm.addEventListener('submit',async event=>{
  event.preventDefault();
  const button=loginForm.querySelector('button[type="submit"]');
  button.disabled=true;loginNote.textContent='Signing in…';
  try{
    const client=await window.GEMZ_GET_SUPABASE();
    if(!client){loginNote.textContent='Sign-in is unavailable right now. Please contact us for help.';return}
    const values=new FormData(loginForm);
    const {error}=await client.auth.signInWithPassword({email:values.get('email'),password:values.get('password')});
    if(error)throw error;
    loginNote.textContent='You are signed in.';
    loginForm.reset();
    await updateAccountState();
  }catch(error){loginNote.textContent='We could not sign you in with those details. Please check them and try again.'}
  finally{button.disabled=false}
});
updateAccountState();
boot('login');
</script>
</body></html>

<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Account Login — Gemz.lk</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"><script>document.documentElement.classList.add('js')</script>
</head><body>
<div id="site-header"></div>
<main><section style="background:var(--paper-2)"><div class="wrap">
  <div class="auth" data-reveal>
    <span class="eyebrow">Welcome back</span><h2 style="font-size:2.6rem;margin-bottom:26px">Account Login</h2>
    <form class="f" id="lf">
      <div class="field"><label>Email</label><input type="email" required></div>
      <div class="field"><label>Password</label><input type="password" required minlength="6"></div>
      <button class="btn btn-gold" type="submit" style="justify-content:center">Sign In</button>
      <p class="note" id="n"></p>
    </form>
  </div>
</div></section></main>
<div id="site-footer"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="js/app.js"></script>
<script>lf.onsubmit=e=>{e.preventDefault();n.textContent='Demo only — connect a backend (e.g. PHP) to enable real login.'};boot('login');</script>
</body></html>

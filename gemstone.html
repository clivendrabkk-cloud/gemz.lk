<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gemstone — Gemz.lk</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"><script>document.documentElement.classList.add('js')</script>
</head><body>
<div id="site-header"></div>
<main>
<section style="padding-top:60px"><div class="wrap">
  <p style="font-size:.75rem;letter-spacing:.2em;text-transform:uppercase;margin-bottom:30px"><a href="collection.html#gem" style="opacity:.6">← GEM</a></p>
  <div class="detail" id="detail"></div>
</div></section>
<section class="collection"><div class="wrap center"><span class="eyebrow">Discover More</span><h2>You May Also Admire</h2></div>
  <div class="wrap"><div class="grid" id="more"></div></div></section>
</main>
<div id="site-footer"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="js/app.js"></script>
<script>
  const slug=new URLSearchParams(location.search).get('slug');
  const g=GEMS.find(x=>x.slug===slug)||GEMS[0];
  document.title=g.name+' — Gemz.lk';
  const gemDetails=[
    ['Code No',g.codeNo||'—'],['Stone',g.name],['Weight',g.weight||'—'],['Clarity Grade',g.clarity||'—'],['Colour',g.colour||'—'],
    ['Origin',g.origin||'—'],['Dimensions',g.dimensions||'—'],['Shape',g.shape||'—'],['Cut',g.cut||'—'],['Treatment',g.treat||'—'],
    ['Certificate',g.certificate||'—'],['Comment',g.comment||'—']
  ];
  const detailRows=rows=>rows.map(([label,value])=>`<tr><td>${label}</td><td>${value}</td></tr>`).join('');
  document.getElementById('detail').innerHTML=`
  <div class="viewer" style="background:${bgOf(g)}"><div class="gem3d">${gemSVG(g,'d')}</div><small>Drag to rotate</small></div>
  <div>
    <span class="eyebrow">Natural Gemstone</span><h1 style="font-size:clamp(2.4rem,5vw,4.2rem)">${g.name}</h1>
    <p class="lead" style="margin-top:20px">${g.text}</p>
    <div class="detail-spec"><h2>GEM DETAILS</h2><table class="specs">${detailRows(gemDetails)}</table></div>
    <div class="detail-actions"><button class="btn btn-gold" id="add">Add to Inquiry</button><a class="btn btn-ghost" href="contact.html?gem=${g.slug}">Request Price</a></div>
    <p class="note" id="msg" style="margin-top:14px"></p>
  </div>`;
  document.getElementById('add').onclick=()=>{Cart.add(g.slug);document.getElementById('msg').textContent=g.name+' added to your inquiry cart.'};
  document.getElementById('more').innerHTML=GEMS.filter(x=>x!==g).slice(0,3).map(cardHTML).join('');
  boot('collection');
</script>
</body></html>

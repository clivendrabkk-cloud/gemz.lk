<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Our Gemstones — Gemz.lk</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"><script>document.documentElement.classList.add('js')</script>
</head><body>
<div id="site-header"></div>
<main>
<section class="page-hero"><div class="wrap"><span class="eyebrow">Our Collection</span><h1 style="font-size:clamp(2.6rem,6vw,5rem)">Our Gemstones</h1><p>Natural, authentic stones from Sri Lanka. Price on request.</p></div></section>
<section style="padding-top:50px"><div class="wrap">
  <div class="chips" id="chips"><button class="chip on" data-f="all">All</button><button class="chip" data-f="sapphire">Sapphires</button><button class="chip" data-f="rare">Rare Stones</button></div>
  <div class="grid" id="grid"></div>
</div></section>
</main>
<div id="site-footer"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="js/app.js"></script>
<script>
  const grid=document.getElementById('grid');
  function render(f){
    const list=GEMS.filter(g=>f==='all'||(f==='sapphire'?/sapphire|padparadscha/i.test(g.name):!/sapphire/i.test(g.name)));
    grid.innerHTML=list.map(cardHTML).join('');
    if(window.gsap)gsap.from(grid.children,{opacity:0,y:40,stagger:.08,duration:.7,ease:'power3.out',clearProps:'all'});
    initTilt();
  }
  function initTilt(){
    if(!window.gsap||matchMedia('(prefers-reduced-motion:reduce)').matches)return;
    grid.querySelectorAll('[data-tilt]').forEach(el=>{
      const rx=gsap.quickTo(el,'rotationX',{duration:.5}),ry=gsap.quickTo(el,'rotationY',{duration:.5});
      gsap.set(el,{transformPerspective:900});
      el.addEventListener('pointermove',e=>{const r=el.getBoundingClientRect();ry(((e.clientX-r.left)/r.width-.5)*14);rx(-((e.clientY-r.top)/r.height-.5)*14)});
      el.addEventListener('pointerleave',()=>{rx(0);ry(0)});
    });
  }
  document.getElementById('chips').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;document.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));b.classList.add('on');render(b.dataset.f)});
  layout('collection');render('all');
</script>
</body></html>

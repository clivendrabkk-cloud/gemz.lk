<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Our Gemstones — Gemz.lk</title>
<link rel="icon" type="image/svg+xml" href="assets/gemz-favicon.svg?v=brand-1">
<link rel="preload" as="image" href="assets/gemz-logo-light.png?v=brand-1" fetchpriority="high">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'"><noscript><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"></noscript>
<link rel="stylesheet" href="css/style.css?v=style-3"><script>document.documentElement.classList.add('js')</script>
</head><body>
<div id="site-header"></div>
<main>
<section class="page-hero"><div class="wrap"><span class="eyebrow" data-setting="collection_eyebrow">Our Collection</span><h1 data-setting="collection_title" style="font-size:clamp(2.6rem,6vw,5rem)">Gems, Jewellery &amp; Watches</h1><p data-setting="collection_description">Explore gemstones, jewellery and watches from Sri Lanka. Prices are available on request.</p></div></section>
<section id="gem"><div class="wrap">
  <div class="collection-tabs" id="collectionTabs" role="tablist" aria-label="Product categories">
    <button class="collection-tab on" type="button" role="tab" aria-selected="true" data-section="gem">GEM</button>
    <button class="collection-tab" type="button" role="tab" aria-selected="false" data-section="jewellery">JEWELLERY</button>
    <button class="collection-tab" type="button" role="tab" aria-selected="false" data-section="watch">WATCH</button>
  </div>
  <div id="categoryPanel" role="tabpanel">
    <div class="category-group" id="gemCategories">
      <p class="category-label">GEM subcategories</p>
      <div class="chips" id="gemChips">
        <button class="chip on" type="button" data-f="all" aria-pressed="true">All Gems</button>
      </div>
      <div class="chips" id="gemTypeChips" aria-label="Gem subcategories"></div>
    </div>
    <div class="category-group" id="jewelleryCategories" hidden>
      <p class="category-label">Browse jewellery</p>
      <div class="chips" id="jewelleryChips"></div>
    </div>
    <div class="category-group" id="watchCategories" hidden>
      <p class="category-label">WATCH</p>
      <div class="chips" id="watchChips" aria-label="Watch subcategories"></div>
      <p class="category-note">Please contact us for watch availability and sourcing.</p>
    </div>
  </div>
  <div class="grid" id="grid"></div>
  <p class="empty-category" id="emptyCategory" hidden></p>
</div></section>
</main>
<div id="site-footer"></div>
<script src="js/supabase-config.js?v=config-1"></script>
<script src="js/app.js?v=app-2"></script>
<script>
window.GEMZ_READY.then(()=>{
  const grid=document.getElementById('grid');
  const emptyCategory=document.getElementById('emptyCategory');
  const categoryGroups={gem:document.getElementById('gemCategories'),jewellery:document.getElementById('jewelleryCategories'),watch:document.getElementById('watchCategories')};
  const initialParams=new URLSearchParams(location.search);
  let section=['gem','jewellery','watch'].includes(initialParams.get('section'))?initialParams.get('section'):'gem';
  let currentFilter='all';
  let currentCategory='Gemstones';
  let requestedCategoryPending=Boolean(initialParams.get('category'));
  const gemChips=document.getElementById('gemChips');
  const gemTypeChips=document.getElementById('gemTypeChips');
  const jewelleryChips=document.getElementById('jewelleryChips');
  const watchChips=document.getElementById('watchChips');
  function selectChip(button,group){
    group.querySelectorAll('.chip').forEach(c=>{const active=c===button;c.classList.toggle('on',active);c.setAttribute('aria-pressed',String(active))});
  }
  function populateFilters(){
    gemTypeChips.innerHTML=GEM_CATEGORIES.map(c=>`<button class="chip" type="button" data-f="${htmlEscape(c.label)}" aria-pressed="false">${htmlEscape(c.label)}</button>`).join('');
    jewelleryChips.innerHTML=`<button class="chip" type="button" data-f="all" aria-pressed="false">All Jewellery</button>${JEWELLERY_CATEGORIES.map(c=>`<button class="chip" type="button" data-f="${htmlEscape(c)}" aria-pressed="false">${htmlEscape(c)}</button>`).join('')}`;
    watchChips.innerHTML=`<button class="chip" type="button" data-f="all" aria-pressed="false">All Watches</button>${WATCH_CATEGORIES.map(c=>`<button class="chip" type="button" data-f="${htmlEscape(c)}" aria-pressed="false">${htmlEscape(c)}</button>`).join('')}`;
  }
  function render(f='all'){
    currentFilter=f;
    let list=[];
    if(section==='gem'){
      const category=GEM_CATEGORIES.find(c=>c.label===f);
      list=GEMS.filter(g=>category?category.match(g):f==='all');
    }
    if(section==='jewellery')list=JEWELLERY_PRODUCTS.filter(product=>f==='all'||product.category===f);
    if(section==='watch')list=WATCH_PRODUCTS.filter(product=>f==='all'||product.category===f);
    grid.innerHTML=list.map(cardHTML).join('');
    emptyCategory.hidden=list.length>0;
    if(section==='jewellery'&&!list.length){
      const detailURL=`jewellery-product.html?category=${encodeURIComponent(currentCategory==='Jewellery'?'Rings':currentCategory)}`;
      emptyCategory.innerHTML=`${htmlEscape(currentCategory)} pieces are available on request. <a class="text-link" href="${detailURL}">View jewellery product details</a>`;
    }else if(section==='watch'&&!list.length){
      emptyCategory.innerHTML='No watches are listed right now. <a class="text-link" href="contact.html?product=watch">Contact us about watch availability</a>.';
    }else{
      emptyCategory.textContent=`${currentCategory} has no products listed yet. Please contact us to ask about availability.`;
    }
    initTilt(grid);
  }
  function setSection(next,filter='all'){
    section=next;
    document.querySelectorAll('.collection-tab').forEach(tab=>{const active=tab.dataset.section===next;tab.classList.toggle('on',active);tab.setAttribute('aria-selected',String(active))});
    Object.entries(categoryGroups).forEach(([key,node])=>node.hidden=key!==next);
    grid.hidden=false;
    currentCategory=next==='watch'?(filter==='all'?'Watches':filter):next==='jewellery'?(filter==='all'?'Jewellery':filter):(filter==='all'?'Gemstones':filter);
    if(next==='gem'){
      const group=filter==='all'?gemChips:gemTypeChips;
      const selected=[...group.querySelectorAll('.chip')].find(chip=>chip.dataset.f===filter);
      selectChip(selected||gemChips.querySelector('[data-f="all"]'),group);
      (filter==='all'?gemTypeChips:gemChips).querySelectorAll('.chip').forEach(c=>{c.classList.remove('on');c.setAttribute('aria-pressed','false')});
    }
    if(next==='jewellery'){
      selectChip([...jewelleryChips.querySelectorAll('.chip')].find(chip=>chip.dataset.f===filter)||null,jewelleryChips);
    }
    if(next==='watch')selectChip([...watchChips.querySelectorAll('.chip')].find(chip=>chip.dataset.f===filter)||null,watchChips);
    render(filter);
  }
  document.getElementById('collectionTabs').addEventListener('click',e=>{const tab=e.target.closest('.collection-tab');if(tab)setSection(tab.dataset.section)});
  gemChips.addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;setSection('gem',b.dataset.f)});
  gemTypeChips.addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;setSection('gem',b.dataset.f)});
  jewelleryChips.addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;setSection('jewellery',b.dataset.f)});
  watchChips.addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;setSection('watch',b.dataset.f)});
  function refreshCollection(){
    populateFilters();
    let desired=currentFilter;
    if(requestedCategoryPending){
      requestedCategoryPending=false;
      const requested=initialParams.get('category')?.toLowerCase();
      desired=section==='gem'?GEM_CATEGORIES.find(c=>c.label.toLowerCase()===requested)?.label||'all':section==='jewellery'?JEWELLERY_CATEGORIES.find(c=>c.toLowerCase()===requested)||'all':WATCH_CATEGORIES.find(c=>c.toLowerCase()===requested)||'all';
    }
    const valid=section==='gem'?desired==='all'||GEM_CATEGORIES.some(c=>c.label===desired):section==='jewellery'?desired==='all'||JEWELLERY_CATEGORIES.includes(desired):section==='watch'?desired==='all'||WATCH_CATEGORIES.includes(desired):false;
    setSection(section,valid?desired:'all');
  }
  populateFilters();
  const requestedCategory=initialParams.get('category');
  if(section==='gem')currentFilter=GEM_CATEGORIES.find(c=>c.label.toLowerCase()===requestedCategory?.toLowerCase())?.label||'all';
  if(section==='jewellery')currentFilter=JEWELLERY_CATEGORIES.find(c=>c.toLowerCase()===requestedCategory?.toLowerCase())||'all';
  if(section==='watch')currentFilter=WATCH_CATEGORIES.find(c=>c.toLowerCase()===requestedCategory?.toLowerCase())||'all';
  setSection(section,currentFilter);
  boot('collection');
  onPageRefresh(refreshCollection);
});
</script>
</body></html>

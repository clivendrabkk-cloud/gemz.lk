<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Insights — Gemz.lk</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"><script>document.documentElement.classList.add('js')</script>
</head><body>
<div id="site-header"></div>
<main>
<section class="page-hero"><div class="wrap"><span class="eyebrow" data-setting="insights_eyebrow">Journal</span><h1 data-setting="insights_title" style="font-size:clamp(2.6rem,6vw,5rem)">Insights</h1><p data-setting="insights_description">Guides, education and market stories from the world of natural gemstones.</p></div></section>
<section><div class="wrap"><div class="posts" id="posts" data-stagger></div></div></section>
</main>
<div id="site-footer"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/app.js"></script>
<script>
window.GEMZ_READY.then(()=>{
  document.getElementById('posts').innerHTML=ARTICLES.map((a,i)=>{const g=GEMS[a.g]||GEMS[0];const visual=a.image_url?`<img src="${htmlEscape(a.image_url)}" alt="${htmlEscape(a.t)}" loading="lazy">`:g?gemSVG(g,'p'+i):'';return `<article class="post"><div class="thumb" style="background:${g?bgOf(g):'linear-gradient(145deg,#171b29,#39405a)'}">${visual}</div><div class="b"><small>${htmlEscape(a.k)}</small><h3>${htmlEscape(a.t)}</h3><p>${htmlEscape(a.p)}</p>${a.content?`<details><summary>Read article</summary><p>${htmlEscape(a.content)}</p></details>`:''}</div></article>`}).join('');
  boot('insights');
});
</script>
</body></html>

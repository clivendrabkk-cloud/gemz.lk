<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Insights — Gemz.lk</title>
<link rel="icon" type="image/svg+xml" href="assets/gemz-favicon.svg?v=brand-1">
<link rel="preload" as="image" href="assets/gemz-logo-light.png?v=brand-1" fetchpriority="high">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'"><noscript><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"></noscript>
<link rel="stylesheet" href="css/style.css?v=style-12"><script>document.documentElement.classList.add('js')</script>
</head><body>
<div id="site-header"></div>
<main>
<section class="page-hero"><div class="wrap"><span class="eyebrow" data-setting="insights_eyebrow">Journal</span><h1 data-setting="insights_title" style="font-size:clamp(2.6rem,6vw,5rem)">Insights</h1><p data-setting="insights_description">Guides, education and market stories from the world of natural gemstones.</p></div></section>
<section><div class="wrap"><div class="posts" id="posts" data-stagger></div></div></section>
</main>
<div id="site-footer"></div>
<script src="js/supabase-config.js?v=config-1"></script>
<script src="js/app.js?v=app-7"></script>
<script>
window.GEMZ_READY.then(()=>{
  function renderInsights(){
    const posts=document.getElementById('posts');
    posts.innerHTML=ARTICLES.length?ARTICLES.map((a,i)=>{const g=GEMS[a.g]||GEMS[0];const visual=a.image_url?`<img src="${htmlEscape(a.image_url)}" alt="${htmlEscape(a.t)}" loading="lazy" decoding="async">`:g?gemSVG(g,'p'+i):'';return `<article class="post"><div class="thumb" style="background:${g?bgOf(g):'linear-gradient(145deg,#171b29,#39405a)'}">${visual}</div><div class="b"><small>${htmlEscape(a.k)}</small><h3>${htmlEscape(a.t)}</h3><p>${htmlEscape(a.p)}</p>${a.content?`<details><summary>Read article</summary><p>${htmlEscape(a.content)}</p></details>`:''}</div></article>`}).join(''):'<div class="empty-content"><h2>No articles published yet</h2><p>Check back soon for gemstone guides and stories.</p><a class="text-link" href="contact.html">Ask our team a question</a></div>';
  }
  renderInsights();
  boot('insights');
  onPageRefresh(renderInsights);
});
</script>
</body></html>

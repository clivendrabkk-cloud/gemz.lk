<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jewellery Details — Gemz.lk</title>
<meta name="description" content="Jewellery features and specifications from Gemz.lk.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"><script>document.documentElement.classList.add('js')</script>
</head><body>
<div id="site-header"></div>
<main>
  <section class="jewellery-product"><div class="wrap">
    <p class="product-back"><a href="collection.html?section=jewellery">← JEWELLERY</a></p>
    <div class="detail">
      <div class="jewellery-product-visual" id="productVisual" aria-hidden="true"></div>
      <div>
        <span class="eyebrow">Features &amp; Specifications</span>
        <h1 id="productName" class="product-title">Jewellery</h1>
        <div class="detail-spec jewellery-spec">
          <h2>JEWELLERY DETAILS</h2>
          <h3>Features &amp; Specifications</h3>
          <table class="specs"><tbody id="productSpecs"></tbody></table>
        </div>
        <div class="detail-actions"><button class="btn btn-gold" id="add">Add to Inquiry</button><a class="btn btn-ghost" id="requestPrice">Request Price</a></div>
        <p class="note" id="message" style="margin-top:14px" aria-live="polite"></p>
      </div>
    </div>
  </div></section>
</main>
<div id="site-footer"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="js/app.js"></script>
<script>
  const params=new URLSearchParams(location.search);
  const category=JEWELLERY_CATEGORIES.find(item=>item.toLowerCase()===params.get('category')?.toLowerCase())||'Rings';
  const inquiryId=`jewellery-${category.toLowerCase()}`;
  document.title=`${category} Jewellery — Gemz.lk`;
  document.getElementById('productName').textContent=category;
  document.getElementById('productVisual').innerHTML=jewelleryArt(category);
  document.getElementById('productSpecs').innerHTML=JEWELLERY_DETAIL_FIELDS.map(label=>`<tr><td>${label}</td><td>—</td></tr>`).join('');
  document.getElementById('requestPrice').href=`contact.html?jewellery=${encodeURIComponent(category)}`;
  document.getElementById('add').onclick=()=>{Cart.add(inquiryId);document.getElementById('message').textContent=`${category} added to your inquiry cart.`};
  boot('collection');
</script>
</body></html>

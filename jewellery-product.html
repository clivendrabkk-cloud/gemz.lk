<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jewellery Details — Gemz.lk</title>
<meta name="description" content="Jewellery features and specifications from Gemz.lk.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"><script>document.documentElement.classList.add('js')</script>
</head><body>
<div id="site-header"></div>
<main>
  <section class="jewellery-product"><div class="wrap">
    <p class="product-back"><a id="productBack" href="collection.html?section=jewellery">← JEWELLERY</a></p>
    <div class="detail">
      <div class="jewellery-product-visual" id="productVisual" aria-hidden="true"></div>
      <div>
        <span class="eyebrow" id="productEyebrow">Features &amp; Specifications</span>
        <h1 id="productName" class="product-title">Jewellery</h1>
        <p id="productDescription" class="lead" style="margin-top:18px"></p>
        <div class="detail-spec jewellery-spec">
          <h2 id="productSectionTitle">JEWELLERY DETAILS</h2>
          <h3 id="productSubheading">Features &amp; Specifications</h3>
          <table class="specs"><tbody id="productSpecs"></tbody></table>
        </div>
        <div class="detail-actions"><button class="btn btn-gold" id="add">Add to Inquiry</button><a class="btn btn-ghost" id="requestPrice">Request Price</a></div>
        <p class="note" id="message" style="margin-top:14px" aria-live="polite"></p>
      </div>
    </div>
  </div></section>
</main>
<div id="site-footer"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/app.js"></script>
<script>
window.GEMZ_READY.then(()=>{
  const params=new URLSearchParams(location.search);
  const product=[...JEWELLERY_PRODUCTS,...WATCH_PRODUCTS].find(item=>item.slug===params.get('slug'));
  const type=product?.type||'jewellery';
  const section=type==='watch'?'watch':'jewellery';
  const category=product?.category||JEWELLERY_CATEGORIES.find(item=>item.toLowerCase()===params.get('category')?.toLowerCase())||'Rings';
  const title=product?.name||category;
  const inquiryId=product?.slug||`jewellery-${category.toLowerCase()}`;
  document.title=`${title} — Gemz.lk`;
  document.getElementById('productBack').href=`collection.html?section=${section}`;
  document.getElementById('productBack').textContent=`← ${section.toUpperCase()}`;
  document.getElementById('productEyebrow').textContent=`${type==='watch'?'Watch':'Jewellery'} features & specifications`;
  document.getElementById('productSectionTitle').textContent=`${type.toUpperCase()} DETAILS`;
  document.getElementById('productSubheading').textContent=`${type==='watch'?'Watch':'Jewellery'} details`;
  document.getElementById('productName').textContent=title;
  document.getElementById('productDescription').textContent=product?.description||'Explore fine jewellery from Sri Lanka. Contact us for current availability and details.';
  document.getElementById('productVisual').innerHTML=product?.image_url?`<img src="${htmlEscape(product.image_url)}" alt="${htmlEscape(title)}">`:type==='watch'?'<span class="watch-glyph" aria-hidden="true">⌚</span>':jewelleryArt(category);
  const details=product?.specs||product?.details||product||{};
  const jewelleryRows=type==='watch'?[]:JEWELLERY_DETAIL_FIELDS.map(label=>[label,details[label]||details[label.toLowerCase().replaceAll(' ','_')]||'—']);
  const knownFields=new Set(JEWELLERY_DETAIL_FIELDS.map(label=>label.toLowerCase().replaceAll(' ','_')));
  jewelleryRows.push(...Object.entries(details).filter(([key])=>!knownFields.has(key.toLowerCase().replaceAll(' ','_'))).map(([key,value])=>[key.replace(/([A-Z])/g,' $1').replace(/^./,letter=>letter.toUpperCase()),value]));
  if(!jewelleryRows.length)jewelleryRows.push(['Details','Contact us for current availability and information.']);
  document.getElementById('productSpecs').innerHTML=jewelleryRows.map(([label,value])=>`<tr><td>${htmlEscape(label)}</td><td>${htmlEscape(value)}</td></tr>`).join('');
  document.getElementById('requestPrice').href=product?`contact.html?product=${encodeURIComponent(product.slug)}`:`contact.html?jewellery=${encodeURIComponent(category)}`;
  document.getElementById('add').onclick=()=>{Cart.add(inquiryId);document.getElementById('message').textContent=`${title} added to your inquiry cart.`};
  boot('collection');
});
</script>
</body></html>

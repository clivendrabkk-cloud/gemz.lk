<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jewellery Details — Gemz.lk</title>
<meta name="description" content="Jewellery features and specifications from Gemz.lk.">
<link rel="icon" type="image/svg+xml" href="assets/gemz-favicon.svg?v=brand-1">
<link rel="preload" as="image" href="assets/gemz-logo-light.png?v=brand-1" fetchpriority="high">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'"><noscript><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"></noscript>
<link rel="stylesheet" href="css/style.css?v=style-12"><script>document.documentElement.classList.add('js')</script>
</head><body>
<div id="site-header"></div>
<main>
  <section class="jewellery-product"><div class="wrap">
    <p class="product-back"><a id="productBack" href="collection.html?section=jewellery">← JEWELLERY</a></p>
    <p class="empty loading-state" id="productLoading" role="status">Loading product details…</p>
    <div class="detail" hidden>
      <div class="jewellery-product-visual" id="productVisual"></div>
      <div>
        <span class="eyebrow" id="productEyebrow">Features &amp; Specifications</span>
        <h1 id="productName" class="product-title">Jewellery</h1>
        <p id="productDescription" class="lead" style="margin-top:18px"></p>
        <div class="detail-spec jewellery-spec">
          <h2 id="productSectionTitle">JEWELLERY DETAILS</h2>
          <h3 id="productSubheading">Features &amp; Specifications</h3>
          <table class="specs"><tbody id="productSpecs"></tbody></table>
        </div>
        <div class="detail-actions"><button class="btn btn-gold" id="add">Add to Inquiry</button><a class="btn btn-ghost" id="requestPrice">Request Price</a></div>
        <p class="note" id="message" style="margin-top:14px" aria-live="polite"></p>
      </div>
    </div>
  </div></section>
</main>
<div id="site-footer"></div>
<script src="js/supabase-config.js?v=config-1"></script>
<script src="js/app.js?v=app-7"></script>
<script>
window.GEMZ_CONTENT_READY.then(async()=>{
  const params=new URLSearchParams(location.search);
  const slug=params.get('slug');
  if(slug&&![...JEWELLERY_PRODUCTS,...WATCH_PRODUCTS].some(item=>item.slug===slug)&&window.GEMZ_FETCH_PRODUCT_BY_SLUG){
    try{
      const product=await window.GEMZ_FETCH_PRODUCT_BY_SLUG(slug);
      if(product){
        if(product.type==='watch')WATCH_PRODUCTS.push(product);
        else if(product.type==='jewellery')JEWELLERY_PRODUCTS.push(product);
      }
    }catch(error){console.warn('Gemz product details could not be loaded.',error)}
  }
  function renderJewelleryProduct(){
    const product=[...JEWELLERY_PRODUCTS,...WATCH_PRODUCTS].find(item=>item.slug===slug);
    if(slug&&!product){
      if(window.GEMZ_CONTENT_PENDING){
        document.title='Loading product — Gemz.lk';
        document.getElementById('productLoading').hidden=false;
        return;
      }
      document.title='Product unavailable — Gemz.lk';
      document.getElementById('productLoading').hidden=true;
      const detail=document.querySelector('.detail');detail.hidden=false;
      detail.innerHTML='<div class="empty"><h2>Product unavailable</h2><p>This item is no longer listed.</p><a class="btn btn-dark" href="collection.html">Browse the collection</a></div>';
      return;
    }
    document.getElementById('productLoading').hidden=true;
    document.querySelector('.detail').hidden=false;
    const type=product?.type||'jewellery';
    const section=type==='watch'?'watch':'jewellery';
    const category=product?.category||JEWELLERY_CATEGORIES.find(item=>item.toLowerCase()===params.get('category')?.toLowerCase())||'Rings';
    const title=product?.name||category;
    const inquiryId=product?.slug||`jewellery-${category.toLowerCase()}`;
    document.title=`${title} — Gemz.lk`;
    applySeoSettings(product?{title:product.seo_title||`${title} | ${SITE_SETTINGS.store_name||'Gemz.lk'}`,description:product.seo_description||product.description,image:product.image_url,type:'product',product}:{title:`${title} | ${SITE_SETTINGS.store_name||'Gemz.lk'}`,description:`Explore ${title.toLowerCase()} from ${SITE_SETTINGS.store_name||'Gemz.lk'}.`});
    document.getElementById('productBack').href=`collection.html?section=${section}`;
    document.getElementById('productBack').textContent=`← ${section.toUpperCase()}`;
    document.getElementById('productEyebrow').textContent=`${type==='watch'?'Watch':'Jewellery'} features & specifications`;
    document.getElementById('productSectionTitle').textContent=`${type.toUpperCase()} DETAILS`;
    document.getElementById('productSubheading').textContent=`${type==='watch'?'Watch':'Jewellery'} details`;
    document.getElementById('productName').textContent=title;
    document.getElementById('productDescription').textContent=product?.description||'Explore fine jewellery from Sri Lanka. Contact us for current availability and details.';
    const productVisual=document.getElementById('productVisual');
    productVisual.classList.toggle('has-product-image',Boolean(product?.image_url));
    productVisual.innerHTML=product?.image_url?`<img src="${htmlEscape(product.image_url)}" alt="${htmlEscape(title)}">`:type==='watch'?'<span class="watch-glyph" aria-hidden="true">⌚</span>':jewelleryArt(category);
    window.GEMZ_REFRESH_IMAGE_ZOOM?.();
    const details=product?.specs||product?.details||product||{};
    const jewelleryRows=product&&type!=='watch'?JEWELLERY_DETAIL_FIELDS.map(label=>[label,details[label]||details[label.toLowerCase().replaceAll(' ','_')]]).filter(([,value])=>value):[];
    const knownFields=new Set(JEWELLERY_DETAIL_FIELDS.map(label=>label.toLowerCase().replaceAll(' ','_')));
    jewelleryRows.push(...Object.entries(details).filter(([key,value])=>value&&!knownFields.has(key.toLowerCase().replaceAll(' ','_'))).map(([key,value])=>[key.replace(/([a-z0-9])([A-Z])/g,'$1 $2').replace(/[_-]+/g,' ').replace(/^./,letter=>letter.toUpperCase()),value]));
    if(!jewelleryRows.length)jewelleryRows.push(['Availability','Contact us for current availability and details.']);
    document.getElementById('productSpecs').innerHTML=jewelleryRows.map(([label,value])=>`<tr><td>${htmlEscape(label)}</td><td>${htmlEscape(value)}</td></tr>`).join('');
    document.getElementById('requestPrice').href=product?`contact.html?product=${encodeURIComponent(product.slug)}`:`contact.html?jewellery=${encodeURIComponent(category)}`;
    document.getElementById('add').onclick=()=>{Cart.add(inquiryId);document.getElementById('message').textContent=`${title} added to your inquiry cart.`};
  }
  renderJewelleryProduct();
  boot('collection');
  onPageRefresh(renderJewelleryProduct);
}).catch(error=>{
  console.error('Gemz product page could not be initialized.',error);
  document.getElementById('productLoading').hidden=true;
  const detail=document.querySelector('.detail');detail.hidden=false;
  detail.innerHTML='<div class="empty"><h2>Product details are unavailable</h2><p>Please try again or contact us for help.</p><a class="btn btn-dark" href="collection.html">Browse the collection</a></div>';
});
</script>
</body></html>

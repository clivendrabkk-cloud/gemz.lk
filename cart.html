<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inquiry Cart — Gemz.lk</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"><script>document.documentElement.classList.add('js')</script>
</head><body>
<div id="site-header"></div>
<main>
<section class="page-hero"><div class="wrap"><span class="eyebrow">Your selection</span><h1 style="font-size:clamp(2.6rem,6vw,5rem)">Inquiry Cart</h1><p>Prices are on request. Send us your selection and we will reply with details.</p></div></section>
<section><div class="wrap" style="max-width:820px"><div id="items"></div><div id="act" style="margin-top:26px"></div></div></section>
</main>
<div id="site-footer"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/app.js"></script>
<script>
window.GEMZ_READY.then(()=>{
  function draw(){
    const list=Cart.get().map(s=>{
      const gem=GEMS.find(item=>item.slug===s);
      if(gem)return{slug:s,name:gem.name,kind:'gem',item:gem};
      const product=[...JEWELLERY_PRODUCTS,...WATCH_PRODUCTS].find(item=>item.slug===s);
      if(product)return{slug:s,name:product.name,kind:product.type,category:product.category,item:product};
      const category=JEWELLERY_CATEGORIES.find(item=>`jewellery-${item.toLowerCase()}`===s);
      return category?{slug:s,name:`${category} Jewellery`,kind:'jewellery',category}:null;
    }).filter(Boolean);
    items.innerHTML=list.length?list.map((item,i)=>{const art=item.item?.image_url?`<img src="${htmlEscape(item.item.image_url)}" alt="${htmlEscape(item.name)}">`:item.kind==='gem'?gemSVG(item.item,'k'+i):item.kind==='watch'?'<span>⌚</span>':jewelleryArt(item.category);return `<div class="cart-item"><div class="frame" style="background:${item.kind==='gem'?bgOf(item.item):'linear-gradient(145deg,#20263a,#474f68)'}">${art}</div><div><h3>${htmlEscape(item.name)}</h3><span class="tag">Price on Request</span></div><button class="rm" data-s="${htmlEscape(item.slug)}">Remove</button></div>`}).join(''):`<div class="empty"><h3>Your inquiry cart is empty</h3><p style="margin:10px 0 24px;opacity:.7">Browse the collection and add pieces you like.</p><a class="btn btn-dark" href="collection.html">Explore the collection</a></div>`;
    const productNames=list.map(item=>item.name).join(', ');
    act.innerHTML=list.length?`<form class="f" id="cartInquiryForm"><div class="row2"><div class="field"><label for="inquiryName">Name</label><input id="inquiryName" name="name" required></div><div class="field"><label for="inquiryEmail">Email</label><input id="inquiryEmail" name="email" type="email" required></div></div><div class="field"><label for="inquiryPhone">Phone</label><input id="inquiryPhone" name="phone" type="tel"></div><div class="field"><label for="inquiryMessage">Message</label><textarea id="inquiryMessage" name="message" rows="4" required>I am interested in: ${htmlEscape(productNames)}</textarea></div><button class="btn btn-gold" type="submit">Send enquiry</button><p class="note" id="cartNote" aria-live="polite"></p></form>`:'';
    Cart.badge();
  }
  items.onclick=e=>{const b=e.target.closest('.rm');if(b){Cart.remove(b.dataset.s);draw()}};
  act.addEventListener('submit',async e=>{
    if(e.target.id!=='cartInquiryForm')return;e.preventDefault();
    const form=e.target,fd=new FormData(form),note=document.getElementById('cartNote');
    const cartItems=Cart.get(),productSlug=cartItems.join(',');
    if(window.GEMZ_SUPABASE){
      note.textContent='Sending your enquiry…';
      try{const {error}=await window.GEMZ_SUPABASE.from('inquiries').insert({name:fd.get('name'),email:fd.get('email'),phone:fd.get('phone'),product_slug:productSlug,message:fd.get('message')});if(error)throw error}
      catch(error){note.textContent='We could not send your enquiry. Please try again or email us directly.';return}
      Cart.set([]);draw();act.innerHTML='<p class="note">Thank you. Your enquiry has been sent to our team.</p>';return;
    }
    location.href='mailto:'+encodeURIComponent(SITE_SETTINGS.contact_email||'info@gemz.lk')+'?subject='+encodeURIComponent('Gemz.lk enquiry')+'&body='+encodeURIComponent(`${fd.get('message')}\n\n${fd.get('name')} · ${fd.get('email')} · ${fd.get('phone')}`);
    note.textContent='Opening your email app…';
  });
  boot('cart').then(draw);
});
</script>
</body></html>

<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inquiry Cart — Gemz.lk</title>
<link rel="icon" type="image/svg+xml" href="assets/gemz-favicon.svg?v=brand-1">
<link rel="preload" as="image" href="assets/gemz-logo-light.png?v=brand-1" fetchpriority="high">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'"><noscript><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"></noscript>
<link rel="stylesheet" href="css/style.css?v=style-3"><script>document.documentElement.classList.add('js')</script>
</head><body>
<div id="site-header"></div>
<main>
<section class="page-hero"><div class="wrap"><span class="eyebrow" data-setting="cart_eyebrow">Your selection</span><h1 data-setting="cart_title" style="font-size:clamp(2.6rem,6vw,5rem)">Inquiry Cart</h1><p data-setting="cart_description">Prices are on request. Send us your selection and we will reply with details.</p></div></section>
<section><div class="wrap" style="max-width:820px"><div id="items"></div><div id="act" style="margin-top:26px"></div></div></section>
</main>
<div id="site-footer"></div>
<script src="js/supabase-config.js?v=config-1"></script>
<script src="js/app.js?v=app-2"></script>
<script>
window.GEMZ_READY.then(()=>{
  function draw(){
    const copy=(key,fallback)=>htmlEscape(SITE_SETTINGS[key]||fallback);
    const existingForm=document.getElementById('cartInquiryForm');
    const previous=existingForm?Object.fromEntries(new FormData(existingForm).entries()):{};
    const list=Cart.get().map(s=>{
      const gem=GEMS.find(item=>item.slug===s);
      if(gem)return{slug:s,name:gem.name,kind:'gem',item:gem};
      const product=[...JEWELLERY_PRODUCTS,...WATCH_PRODUCTS].find(item=>item.slug===s);
      if(product)return{slug:s,name:product.name,kind:product.type,category:product.category,item:product};
      const category=JEWELLERY_CATEGORIES.find(item=>`jewellery-${item.toLowerCase()}`===s);
      if(category)return{slug:s,name:`${category} Jewellery`,kind:'jewellery',category};
      return{slug:s,name:window.GEMZ_CONTENT_PENDING?'Loading item…':'Item unavailable',kind:'unavailable'};
    });
    items.innerHTML=list.length?list.map((item,i)=>{const art=item.item?.image_url?`<img src="${htmlEscape(item.item.image_url)}" alt="${htmlEscape(item.name)}" loading="lazy" decoding="async">`:item.kind==='gem'?gemSVG(item.item,'k'+i):item.kind==='watch'?'<span>⌚</span>':item.kind==='jewellery'?jewelleryArt(item.category):'<span class="cart-placeholder" aria-hidden="true">◇</span>';return `<div class="cart-item"><div class="frame">${art}</div><div><h3>${htmlEscape(item.name)}</h3><span class="tag">${copy('cart_price_label','Price on Request')}</span></div><button class="rm" type="button" data-s="${htmlEscape(item.slug)}" aria-label="${htmlEscape(SITE_SETTINGS.cart_remove_label||'Remove')} ${htmlEscape(item.name)} from your inquiry">${copy('cart_remove_label','Remove')}</button></div>`}).join(''):`<div class="empty"><h3>${copy('cart_empty_title','Your inquiry cart is empty')}</h3><p style="margin:10px 0 24px;opacity:.7">${copy('cart_empty_description','Browse the collection and add pieces you like.')}</p><a class="btn btn-dark" href="collection.html">${copy('cart_explore_button','Explore the collection')}</a></div>`;
    const productNames=list.map(item=>item.name).join(', ');
    const message=htmlEscape(String(SITE_SETTINGS.cart_default_message||'I am interested in: {products}').replaceAll('{products}',productNames));
    act.innerHTML=list.length?`<form class="f" id="cartInquiryForm"><div class="row2"><div class="field"><label for="inquiryName">${copy('cart_name_label','Name')}</label><input id="inquiryName" name="name" required></div><div class="field"><label for="inquiryEmail">${copy('cart_email_label','Email')}</label><input id="inquiryEmail" name="email" type="email" required></div></div><div class="field"><label for="inquiryPhone">${copy('cart_phone_label','Phone')}</label><input id="inquiryPhone" name="phone" type="tel"></div><div class="field"><label for="inquiryMessage">${copy('cart_message_label','Message')}</label><textarea id="inquiryMessage" name="message" rows="4" required>${message}</textarea></div><button class="btn btn-gold" type="submit">${copy('cart_submit_label','Send enquiry')}</button><p class="field-help">Your enquiry opens in WhatsApp with the selected products and your details. Tap Send there to deliver it.</p><p class="note" id="cartNote" aria-live="polite"></p></form>`:'';
    const form=document.getElementById('cartInquiryForm');
    if(form)Object.entries(previous).forEach(([name,value])=>{if(form.elements[name])form.elements[name].value=value});
    Cart.badge();
  }
  onPageRefresh(draw);
  items.onclick=e=>{const b=e.target.closest('.rm');if(b){Cart.remove(b.dataset.s);draw()}};
  act.addEventListener('submit',async e=>{
    if(e.target.id!=='cartInquiryForm')return;e.preventDefault();
    const form=e.target,fd=new FormData(form),note=document.getElementById('cartNote');
    const cartItems=Cart.get(),productSlug=cartItems.join(',');
    const submitButton=form.querySelector('[type="submit"]');
    submitButton.disabled=true;
    const productDetails=whatsAppProductDetails(cartItems),message=whatsAppInquiryMessage({products:productDetails,name:fd.get('name'),email:fd.get('email'),phone:fd.get('phone'),message:fd.get('message'),site:SITE_SETTINGS.store_name||location.host});
    const whatsappURL=whatsAppChatURL(SITE_SETTINGS.whatsapp_number,message);
    if(!whatsappURL){note.textContent=`WhatsApp is not configured yet. Please call ${SITE_SETTINGS.contact_phone||'the store'} or email ${SITE_SETTINGS.contact_email||'the store'}.`;submitButton.disabled=false;return}
    launchWhatsAppChat(whatsappURL);note.innerHTML=whatsAppReadyMarkup(whatsappURL);
    if(window.GEMZ_SUPABASE_CONFIG?.url&&window.GEMZ_SUPABASE_CONFIG?.anonKey)createInquiry({name:fd.get('name'),email:fd.get('email'),phone:fd.get('phone'),product_slug:productSlug,message}).catch(error=>console.warn('Could not save the WhatsApp enquiry to the admin dashboard.',error));
    submitButton.disabled=false;
  });
  boot('cart').then(draw);
});
</script>
</body></html>

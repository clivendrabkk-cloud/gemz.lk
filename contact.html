<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contact Us — Gemz.lk</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"><script>document.documentElement.classList.add('js')</script>
</head><body>
<div id="site-header"></div>
<main>
<section class="page-hero"><div class="wrap"><span class="eyebrow">Get in touch</span><h1 style="font-size:clamp(2.6rem,6vw,5rem)">Contact Us</h1><p>Tell us what you are looking for and we will respond personally.</p></div></section>
<section><div class="wrap contact-grid">
  <div data-reveal>
    <h2 style="font-size:2.4rem;margin-bottom:20px">Visit &amp; Connect</h2>
    <div class="info-row"><span class="ico" id="i1"></span><div><b>Call</b>+94 11 234 5678</div></div>
    <div class="info-row"><span class="ico" id="i2"></span><div><b>Email</b>info@gemz.lk</div></div>
    <div class="info-row"><span class="ico" id="i3"></span><div><b>Location</b>Colombo, Sri Lanka</div></div>
    <p style="margin-top:20px;font-size:.85rem;opacity:.6">Placeholder details — replace with your real phone, email and address.</p>
  </div>
  <form class="f" id="form" data-reveal>
    <div class="row2"><div class="field"><label>Name</label><input name="name" required></div><div class="field"><label>Email</label><input type="email" name="email" required></div></div>
    <div class="row2"><div class="field"><label>Phone</label><input name="phone"></div>
      <div class="field"><label>Gemstone</label><select name="gem" id="gemsel"><option value="">General enquiry</option></select></div></div>
    <div class="field"><label>Message</label><textarea name="msg" rows="5" required></textarea></div>
    <button class="btn btn-gold" type="submit" style="justify-self:start">Send Enquiry</button>
    <p class="note" id="note"></p>
  </form>
</div></section>
</main>
<div id="site-footer"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="js/app.js"></script>
<script>
  i1.innerHTML=icon.phone;i2.innerHTML=icon.mail;i3.innerHTML=icon.pin;
  [i1,i2,i3].forEach(e=>e.firstChild.setAttribute('style','width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6'));
  gemsel.innerHTML+=GEMS.map(g=>`<option value="${g.slug}">${g.name}</option>`).join('');
  const p=new URLSearchParams(location.search).get('gem');if(p)gemsel.value=p;
  form.onsubmit=e=>{e.preventDefault();
    const d=new FormData(form);
    location.href='mailto:info@gemz.lk?subject='+encodeURIComponent('Enquiry: '+(d.get('gem')||'General'))+'&body='+encodeURIComponent(d.get('msg')+'\n\n'+d.get('name')+' · '+d.get('email')+' · '+d.get('phone'));
    note.textContent='Opening your email app… (connect a form backend to send directly).';};
  boot('contact');
</script>
</body></html>

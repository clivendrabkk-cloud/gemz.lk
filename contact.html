<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contact Us — Gemz.lk</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"><script>document.documentElement.classList.add('js')</script>
</head><body>
<div id="site-header"></div>
<main>
<section class="page-hero"><div class="wrap"><span class="eyebrow" data-setting="contact_eyebrow">Get in touch</span><h1 data-setting="contact_title" style="font-size:clamp(2.6rem,6vw,5rem)">Contact Us</h1><p data-setting="contact_description">Tell us what you are looking for and we will respond personally.</p></div></section>
<section><div class="wrap contact-grid">
  <div data-reveal>
    <h2 style="font-size:2.4rem;margin-bottom:20px">Visit &amp; Connect</h2>
    <div class="info-row"><span class="ico" id="i1"></span><div><b>Call</b><span data-setting="contact_phone">+94 11 234 5678</span></div></div>
    <div class="info-row"><span class="ico" id="i2"></span><div><b>Email</b><span data-setting="contact_email">info@gemz.lk</span></div></div>
    <div class="info-row"><span class="ico" id="i3"></span><div><b>Location</b><span data-setting="contact_address">Colombo, Sri Lanka</span></div></div>
    <p data-setting="contact_note" style="margin-top:20px;font-size:.85rem;opacity:.6">Placeholder details — replace with your real phone, email and address.</p>
  </div>
  <form class="f" id="form" data-reveal>
    <div class="row2"><div class="field"><label>Name</label><input name="name" required></div><div class="field"><label>Email</label><input type="email" name="email" required></div></div>
    <div class="row2"><div class="field"><label>Phone</label><input name="phone"></div>
      <div class="field"><label>Product</label><select name="product" id="gemsel"><option value="">General enquiry</option></select></div></div>
    <div class="field"><label>Message</label><textarea name="msg" rows="5" required></textarea></div>
    <button class="btn btn-gold" type="submit" style="justify-self:start">Send Enquiry</button>
    <p class="note" id="note"></p>
  </form>
</div></section>
</main>
<div id="site-footer"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/app.js"></script>
<script>
window.GEMZ_READY.then(()=>{
  i1.innerHTML=icon.phone;i2.innerHTML=icon.mail;i3.innerHTML=icon.pin;
  [i1,i2,i3].forEach(e=>e.firstChild.setAttribute('style','width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6'));
  const products=[...GEMS,...JEWELLERY_PRODUCTS,...WATCH_PRODUCTS];
  gemsel.innerHTML+=products.map(product=>`<option value="${htmlEscape(product.slug)}">${htmlEscape(product.name)}</option>`).join('');
  const params=new URLSearchParams(location.search),requested=params.get('product')||params.get('gem')||params.get('jewellery');if(requested)gemsel.value=requested;
  form.onsubmit=async e=>{e.preventDefault();
    const d=new FormData(form);
    if(window.GEMZ_SUPABASE){
      note.textContent='Sending your enquiry…';
      try{
        const {error}=await window.GEMZ_SUPABASE.from('inquiries').insert({name:d.get('name'),email:d.get('email'),phone:d.get('phone'),product_slug:d.get('product'),message:d.get('msg')});
        if(error)throw error;
        note.textContent='Thank you. Your enquiry has been sent to our team.';form.reset();return;
      }catch(error){note.textContent='We could not send that enquiry. Please try again or email us directly.';return}
    }
    location.href='mailto:'+encodeURIComponent(SITE_SETTINGS.contact_email||'info@gemz.lk')+'?subject='+encodeURIComponent('Enquiry: '+(d.get('product')||'General'))+'&body='+encodeURIComponent(d.get('msg')+'\n\n'+d.get('name')+' · '+d.get('email')+' · '+d.get('phone'));
    note.textContent='Opening your email app…';};
  boot('contact');
});
</script>
</body></html>
